<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ローカルフォルダ スライドショー</title>
<style>
  :root{
    --bg:#0a0b0d; --fg:#e9eaee; --dim:#8b909b; --line:#23252b; --acc:#6aa8ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-user-select:none;user-select:none;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- ステージ ---------- */
  #stage{position:fixed;inset:0;background:#000}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none}
  .layer.on{opacity:1}

  .pack{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
  .pack.multi{gap:8px;padding:8px}
  .slot{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;
    overflow:hidden}
  .slot img,.slot video{width:100%;height:100%;object-fit:contain;display:block}
  body.cover .slot img,body.cover .slot video{object-fit:cover}

  /* ---------- 進捗バー ---------- */
  #prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--acc);
    transition:opacity .3s;z-index:5;pointer-events:none}
  body.idle #prog{opacity:0}

  /* ---------- 情報 ---------- */
  #info{position:fixed;top:14px;left:16px;z-index:6;max-width:60vw;
    font-size:12px;color:#cfd3db;text-shadow:0 1px 6px rgba(0,0,0,.9);transition:opacity .3s}
  #info b{font-weight:500}
  #track{display:block;margin-top:3px;color:var(--acc);font-size:12px}
  #track[hidden]{display:none}
  #info span{color:var(--dim)}

  /* ---------- コントロールバー ---------- */
  #ui{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:14px;
    background:rgba(20,21,25,.82);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,.5);transition:opacity .3s,transform .3s;
    flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
  body.idle #ui,body.idle #info{opacity:0;pointer-events:none}
  body.idle #stage{cursor:none}
  body.hideui #ui,body.hideui #info,body.hideui #prog{opacity:0;pointer-events:none}
  .btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#c9cdd6;position:relative}
  .btn:hover{background:#2a2d35;color:#fff}
  .btn.act{color:var(--acc)}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  #bPair .cols{position:absolute;right:2px;bottom:1px;font-size:9px;line-height:1;
    font-weight:700;color:var(--acc);opacity:0}
  #bPair.act .cols{opacity:1}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .fld{display:flex;align-items:center;gap:7px;padding:0 8px;font-size:12px;color:var(--dim)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:82px;height:3px;border-radius:2px;
    background:#3a3e47;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
    border-radius:50%;background:var(--acc);cursor:pointer}
  select{font:inherit;font-size:12px;color:var(--fg);background:#2a2d35;border:1px solid var(--line);
    border-radius:8px;padding:4px 6px;cursor:pointer}
  #count{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);padding:0 8px;white-space:nowrap}

  body.zoom .slot img,body.zoom .slot video{cursor:grab}
  body.zoom .slot img:active,body.zoom .slot video:active{cursor:grabbing}

  /* ---------- 短い知らせ ---------- */
  #toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:8;
    padding:9px 15px;border-radius:11px;background:rgba(20,22,27,.94);border:1px solid var(--line);
    font-size:12px;color:#dfe3ea;opacity:0;transition:opacity .25s;pointer-events:none;
    white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
  #toast.on{opacity:1}
  #vtime{font-variant-numeric:tabular-nums;font-size:12px;color:var(--acc);
    padding:0 4px;white-space:nowrap}

  /* ---------- 続きから ---------- */
  #resume{position:fixed;top:0;left:0;right:0;z-index:7;display:none;
    justify-content:center;align-items:center;gap:12px;padding:12px 16px;
    background:linear-gradient(rgba(20,22,27,.92),rgba(20,22,27,0));
    font-size:12px;color:#cfd3db;transition:opacity .3s}
  #resume.on{display:flex}
  body.idle #resume,body.hideui #resume{opacity:0;pointer-events:none}
  #resume button{color:var(--acc);font-size:12px;padding:4px 10px;border-radius:8px;
    border:1px solid #333741;background:#191b21;white-space:nowrap}
  #resume button:hover{background:#22252c}

  /* ---------- 中断の記録 ---------- */
  .logbox{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;text-align:left}
  .logbox summary{cursor:pointer;font-size:12px;color:var(--dim);text-align:center;list-style:none}
  .logbox summary::-webkit-details-marker{display:none}
  .logbox summary:hover{color:var(--fg)}
  .logbox .scroll{max-height:220px;overflow:auto;margin-top:12px}
  .logbox table{width:100%;border-collapse:collapse;font-size:11px;color:#aeb3bd}
  .logbox th,.logbox td{text-align:left;padding:4px 6px;border-bottom:1px solid #1e2026;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  .logbox th{color:#666b76;font-weight:500;position:sticky;top:0;background:#0e1013}
  .logbox .acts{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .logbox .acts button{font-size:11px;color:#aeb3bd;border:1px solid #333741;border-radius:8px;padding:5px 10px}
  .logbox .acts button:hover{background:#22252c;color:#fff}
  #last{margin-top:16px;font-size:12px;color:var(--dim);line-height:1.7}

  /* ---------- ピッカー ---------- */
  #picker{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;
    background:radial-gradient(120% 90% at 50% 0%,#15171c 0%,var(--bg) 60%)}
  #picker.hidden{display:none}
  .card{width:min(600px,100%);text-align:center;border:1px dashed #333741;border-radius:20px;
    padding:44px 32px;transition:border-color .2s,background .2s}
  .card.drag{border-color:var(--acc);background:rgba(106,168,255,.06)}
  .card h1{font-size:19px;font-weight:600;margin:0 0 6px}
  .card p{margin:0 0 22px;color:var(--dim);font-size:13px}
  .cta{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#08121f;
    font-weight:600;padding:10px 20px;border-radius:11px}
  .cta:hover{filter:brightness(1.08)}
  .sub{margin-top:16px;font-size:12px;color:#666b76;line-height:2.1}
  kbd{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:#22252c;border:1px solid #33373f;
    border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:#aeb3bd}
  #err{margin-top:14px;color:#ff8f8f;font-size:12px;min-height:1em}
  #busy{position:fixed;inset:0;z-index:25;display:none;place-items:center;background:rgba(10,11,13,.85);
    color:var(--dim);font-size:13px}
  #busy.on{display:grid}
</style>
</head>
<body>

<div id="stage">
  <div class="layer" id="l0"></div>
  <div class="layer" id="l1"></div>
</div>

<div id="prog"></div>
<div id="info"><b id="fname"></b> <span id="fdir"></span><span id="track" hidden></span></div>
<div id="resume"></div>
<div id="toast"></div>

<div id="ui">
  <button class="btn" id="bPrev" title="前へ (←)"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
  <button class="btn" id="bPlay" title="再生/一時停止 (Space)"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  <button class="btn" id="bNext" title="次へ (→)"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <span class="fld"><span id="ivalLabel">5s</span><input type="range" id="ival" min="1" max="30" step="1" value="5" title="表示秒数"></span>
  <span class="sep"></span>
  <button class="btn" id="bAsmr" title="ASMRモード — 音声ファイルを中心に流す (A)">
    <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
  </button>
  <button class="btn" id="bSound" title="音を消す / 出す (M) ・ 音量は ↑↓"></button>
  <span id="vtime"></span>
  <span class="sep"></span>
  <button class="btn" id="bPair" title="縦長画像を左右に並べる (P)">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="7" height="16" rx="1.3"/><rect x="13.5" y="4" width="7" height="16" rx="1.3"/></svg>
    <span class="cols" id="colsLabel">2</span>
  </button>
  <button class="btn" id="bShuffle" title="シャッフル (S)"><svg viewBox="0 0 24 24"><path d="M16 4h4v4M4 20 20 4M4 4l5 5M15 15l5 5M16 20h4v-4"/></svg></button>
  <select id="sort" title="並び順">
    <option value="name">名前順</option>
    <option value="date">更新日順</option>
    <option value="dateDesc">更新日（新しい順）</option>
  </select>
  <button class="btn" id="bFit" title="全画面に合わせる/はみ出し (C)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
  <button class="btn" id="bFull" title="フルスクリーン (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg></button>
  <span class="sep"></span>
  <span id="count">0 / 0</span>
  <button class="btn" id="bOpen" title="別のフォルダを開く"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
</div>

<div id="picker">
  <div class="card" id="card">
    <h1>ローカルフォルダ スライドショー</h1>
    <p>フォルダを選ぶか、ここにドラッグ＆ドロップしてください<br>（サブフォルダも含めて読み込みます）</p>
    <button class="cta" id="bPick">
      <svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      フォルダを選択
    </button>
    <div class="sub">
      <kbd>Space</kbd> 再生 ・ <kbd>←</kbd><kbd>→</kbd> 移動 ・ <kbd>F</kbd> 全画面<br>
      <kbd>P</kbd> 縦長を左右に並べる ・ <kbd>S</kbd> シャッフル ・ <kbd>C</kbd> 表示切替 ・ <kbd>H</kbd> UI非表示<br>
      <kbd>M</kbd> 消音 ・ <kbd>↑</kbd><kbd>↓</kbd> 音量（動画に音があれば鳴ります）<br>
      ホイールで拡大 ・ ドラッグで動かす ・ <kbd>0</kbd> で戻す<br>
      <kbd>A</kbd> ASMRモード（同じフォルダの音声を流しながら絵を送る）
    </div>
    <div id="err"></div>
    <div id="last"></div>
    <details class="logbox" id="logbox" hidden>
      <summary id="logSum">中断の記録を見る</summary>
      <div class="scroll" id="logBody"></div>
      <div class="acts">
        <button id="bCsv">CSVで書き出す</button>
        <button id="bClear">記録を消す</button>
      </div>
    </details>
  </div>
</div>

<div id="busy">読み込み中…</div>

<input type="file" id="fileInput" webkitdirectory directory multiple hidden>

<script>
(() => {
  const IMG = /\.(jpe?g|png|gif|webp|avif|bmp|svg|ico|heic|heif)$/i;
  const VID = /\.(mp4|webm|m4v|mov|ogv)$/i;
  const AUD = /\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|weba|aif|aiff)$/i;
  const MAX_COLS = 3;          // 並べる上限
  const $ = id => document.getElementById(id);

  const stage=$('stage'), layers=[$('l0'),$('l1')], picker=$('picker'), card=$('card'),
        busy=$('busy'), err=$('err'), input=$('fileInput'), prog=$('prog');

  let items=[], order=[], pos=0, span=1, front=0, playing=true, shuffle=false, pair=false,
      interval=5000, sortMode='name', timer=null, tStart=0, curUrls=[], token=0,
      muted=false, volume=1, needTap=false, curPack=null, dir=1,
      zoomed=false, pan=null, skipClick=false,
      asmr=false, tracks=[], tIdx=0, trackUrl=null, failRun=0;

  /* ---------- 設定の保存 ---------- */
  const S = {
    load(){ try{ return JSON.parse(localStorage.getItem('slideshow')||'{}'); }catch{ return {}; } },
    save(){ try{ localStorage.setItem('slideshow', JSON.stringify(
      {interval, shuffle, sortMode, pair, muted, volume, asmr,
       cover:document.body.classList.contains('cover')})); }catch{} }
  };

  /* ---------- ファイル収集 ---------- */
  const isMedia = n => IMG.test(n) || VID.test(n);

  function addFiles(list){
    const out=[], aud=[];
    for(const f of list){
      const rel = f.webkitRelativePath || f.__rel || f.name;
      if(/(^|\/)\._/.test(rel)) continue;
      const base = {file:f, rel, name:rel.split('/').pop(), dir:rel.split('/').slice(0,-1).join('/'),
                    time:f.lastModified||0};
      if(AUD.test(rel)) aud.push(base);                       // 音声は絵として出さず、別に持つ
      else if(isMedia(rel)) out.push({...base, video:VID.test(rel), ar:undefined});
    }
    return {media:out, tracks:aud};
  }

  async function walkEntry(entry, path, out){
    if(entry.isFile){
      const f = await new Promise((res,rej)=>entry.file(res,rej)).catch(()=>null);
      if(f){ f.__rel = path + entry.name; out.push(f); }
    } else if(entry.isDirectory){
      const reader = entry.createReader();
      for(;;){
        const batch = await new Promise((res)=>reader.readEntries(res,()=>res([])));
        if(!batch.length) break;
        for(const e of batch) await walkEntry(e, path + entry.name + '/', out);
      }
    }
  }

  async function fromDrop(dt){
    const entries = [...dt.items].map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length) return [...dt.files];
    const out=[];
    for(const e of entries) await walkEntry(e, '', out);
    return out;
  }

  async function fromHandle(dir, path, out){
    for await (const h of dir.values()){
      if(h.kind === 'directory') await fromHandle(h, path + h.name + '/', out);
      else { const f = await h.getFile(); f.__rel = path + h.name; out.push(f); }
    }
  }

  /* ---------- 縦横比の下調べ ---------- */
  // ar = 幅 / 高さ。null は「並べられない」（動画・読めなかったもの）
  function measure(it){
    if(it.ar !== undefined) return Promise.resolve(it.ar);
    if(it.video){ it.ar = null; return Promise.resolve(null); }
    return it.__p || (it.__p = new Promise(res => {
      const u = URL.createObjectURL(it.file), im = new Image();
      const done = v => { it.ar = v; URL.revokeObjectURL(u); res(v); };
      im.onload = () => done(im.naturalWidth && im.naturalHeight ? im.naturalWidth/im.naturalHeight : null);
      im.onerror = () => done(null);
      im.src = u;
    }));
  }

  // 表示順に、同時3枚までで先回りして調べる
  let qAt=0, qRun=0;
  function pump(){
    if(!pair) return;
    while(qRun < 3 && qAt < order.length){
      const it = items[order[qAt++]];
      if(it.ar !== undefined) continue;
      qRun++;
      measure(it).then(() => { qRun--; pump(); });
    }
  }

  /* ---------- 並べる枚数 ---------- */
  // ディスプレイ（ステージ）の縦横比に、縦長画像が何枚収まるか
  function colsFor(ar){
    if(!pair || !ar || ar >= 1) return 1;
    const a = stage.clientWidth / stage.clientHeight;
    return Math.max(1, Math.min(MAX_COLS, Math.floor(a / ar)));
  }
  const pairable = k => {
    const it = items[order[k]];
    return !!it && !it.video && !!it.ar && it.ar < 1;
  };
  // どこから入っても同じ組になるよう、連続する縦長の並びの先頭を基準に区切る
  function groupAt(p){
    if(!pair || !pairable(p)) return [p];
    let r = p; while(r > 0 && pairable(r-1)) r--;
    const n = colsFor(items[order[r]].ar);
    if(n < 2) return [p];
    const s = r + Math.floor((p - r) / n) * n;
    const out = [];
    for(let k = s; k < s + n && k < order.length && pairable(k); k++) out.push(k);
    return out.length ? out : [p];
  }

  /* ---------- 中断の記録 ---------- */
  const LOG_KEY = 'slideshow.log';
  let folderKey='', sessStart=0, seen=0;

  // プライベートウィンドウや file:// の制限で保存できないことがあるので、最初に確かめる
  const canStore = (() => {
    try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); return true; }
    catch{ return false; }
  })();
  const logAll  = () => { try{ return JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }catch{ return []; } };
  const logSave = a => { try{ localStorage.setItem(LOG_KEY, JSON.stringify(a.slice(-300))); }catch{} };
  const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function stamp(t){
    const d = new Date(t), z = v => String(v).padStart(2,'0');
    return d.getFullYear()+'/'+z(d.getMonth()+1)+'/'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
  }

  // いま映っているものを「見るのをやめた地点」として書き留める
  function recordStop(why){
    if(!order.length || !folderKey || !items[order[pos]]) return;
    const names = [];
    for(let k = pos; k < pos + span && k < order.length; k++) names.push(items[order[k]].name);
    const rec = {t:Date.now(), folder:folderKey, name:names.join(' ／ '), idx:pos+1, total:order.length,
                 seen, ms: sessStart ? Date.now()-sessStart : 0, playing, why,
                 track: (asmr && tracks[tIdx]) ? tracks[tIdx].name : ''};
    const a = logAll(), prev = a[a.length-1];
    // 同じ写真のまま出たり入ったりしただけなら、増やさずに書き換える
    if(prev && prev.folder === rec.folder && prev.idx === rec.idx && rec.t - prev.t < 600000)
      a[a.length-1] = rec;
    else a.push(rec);
    logSave(a);
  }

  function lastFor(key){
    const a = logAll();
    for(let i = a.length-1; i >= 0; i--) if(a[i].folder === key) return a[i];
    return null;
  }

  function offerResume(rec){
    const bar = $('resume');
    bar.textContent = '前回はここで終わっていました — ' + rec.name +
                      '（' + rec.idx + '/' + rec.total + '・' + stamp(rec.t) + '）';
    const b = document.createElement('button');
    b.textContent = '最初から';
    b.onclick = e => { e.stopPropagation(); bar.classList.remove('on'); show(0, true); };
    bar.appendChild(b);
    bar.classList.add('on');
    setTimeout(()=>bar.classList.remove('on'), 12000);
  }

  function renderLog(){
    const a = logAll(), box = $('logbox'), last = a[a.length-1];
    box.hidden = !a.length;
    if(!canStore){
      $('last').textContent = '⚠ このブラウザ（またはこの開き方）では記録を保存できません。'
        + 'プライベートウィンドウを閉じるか、https://haristweet.github.io/slideshow/ を開いてください。';
      return;
    }
    $('last').textContent = last
      ? '前回の中断: ' + last.name + '（' + last.folder + ' の ' + last.idx + '/' + last.total + '枚目・' + stamp(last.t) + '）'
      : '';
    if(!a.length) return;
    $('logSum').textContent = '中断の記録を見る（' + a.length + '件）';
    $('logBody').innerHTML = '<table><tr><th>日時</th><th>フォルダ</th><th>写真</th><th>音声</th><th>位置</th><th>見た枚数</th><th>時間</th></tr>'
      + a.slice(-40).reverse().map(r =>
          '<tr><td>' + stamp(r.t) + '</td><td>' + esc(r.folder) + '</td><td>' + esc(r.name) +
          '</td><td>' + esc(r.track || '') + '</td><td>' + r.idx + ' / ' + r.total + '</td><td>' +
          r.seen + '枚</td><td>' + Math.round(r.ms/1000) + '秒</td></tr>').join('') + '</table>';
  }

  addEventListener('pagehide', () => recordStop('閉じた'));
  document.addEventListener('visibilitychange', () => { if(document.hidden) recordStop('画面を離れた'); });

  /* ---------- 読み込み ---------- */
  async function load(rawFiles){
    recordStop('フォルダを変えた');
    busy.classList.add('on');
    await new Promise(r=>setTimeout(r,10));
    const got = addFiles(rawFiles);
    items = got.media; tracks = got.tracks; tIdx = 0; failRun = 0;
    busy.classList.remove('on');
    if(!items.length){
      err.textContent = tracks.length
        ? '音声は' + tracks.length + '件ありましたが、映す画像がありませんでした'
        : '画像・動画が見つかりませんでした（jpg / png / gif / webp / heic / mp4 / mov など）';
      return;
    }
    err.textContent = '';
    picker.classList.add('hidden');
    buildOrder(true);

    // フォルダ名で前回の続きを探す
    const rel0 = items[0].rel;
    folderKey = rel0.includes('/') ? rel0.split('/')[0] : '(フォルダ直下)';
    sessStart = Date.now(); seen = 0;
    sortTracks();
    $('track').hidden = !(asmr && tracks.length);
    if(asmr && tracks.length) startTrack(0);
    else {
      audio.pause();                 // 前のフォルダの音を持ち越さない
      if(tracks.length) toast('音声が' + tracks.length + '件あります。A でASMRモード', 5000);
      else if(asmr) toast('このフォルダには音声がありません', 3000);
    }

    const rec = lastFor(folderKey);
    if(rec && rec.idx > 1 && rec.idx <= items.length){ show(rec.idx - 1, true); offerResume(rec); }
    else show(0, true);
    wake();
  }

  function buildOrder(reset){
    const idx = items.map((_,i)=>i);
    if(shuffle){
      for(let i=idx.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [idx[i],idx[j]]=[idx[j],idx[i]]; }
    } else {
      const coll = new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
      idx.sort((a,b)=>{
        if(sortMode==='name') return coll.compare(items[a].rel, items[b].rel);
        if(sortMode==='date') return items[a].time - items[b].time;
        return items[b].time - items[a].time;
      });
    }
    sortTracks();
    const cur = order.length ? order[pos] : -1;
    order = idx;
    pos = reset ? 0 : Math.max(0, order.indexOf(cur));
    qAt = 0; pump();
  }

  /* ---------- 短い知らせ ---------- */
  let toastT;
  function toast(msg, ms){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(()=>t.classList.remove('on'), ms || 2200);
  }

  /* ---------- 音 ---------- */
  const SPK = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.8a4 4 0 0 1 0 6.4"/></svg>';
  const MUTE = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 10l4 4M21 10l-4 4"/></svg>';
  const vids = () => curPack ? curPack.querySelectorAll('video') : [];

  function applySound(){
    vids().forEach(v => { v.muted = asmr ? true : (muted || needTap); v.volume = volume; });
    audio.muted = muted; audio.volume = volume;
    $('bSound').innerHTML = (muted || needTap) ? MUTE : SPK;
    $('bSound').classList.toggle('act', !(muted || needTap));
  }
  function setVolume(v){
    volume = Math.min(1, Math.max(0, Math.round(v*10)/10));
    if(volume > 0) muted = false;
    applySound(); S.save();
    toast('音量 ' + Math.round(volume*100) + '%');
  }
  // 音つきの自動再生が拒まれた場合は、消音で流しておいて最初の操作で音を出す
  function armTap(){
    if(needTap) return;
    needTap = true; applySound();
    toast('クリックすると音が出ます', 4000);
    const on = () => {
      needTap = false; applySound();
      removeEventListener('mousedown', on, true); removeEventListener('keydown', on, true);
      removeEventListener('touchstart', on, true);
    };
    addEventListener('mousedown', on, true);
    addEventListener('keydown', on, true);
    addEventListener('touchstart', on, true);
  }

  /* ---------- ASMRモード ---------- */
  // 絵とは別に、音声を1本ずつ流し続ける。絵は表示秒数で送り、音が1本終わった
  // 時点でも切り替える。全部鳴らし終わったら最初に戻る。
  const audio = new Audio();
  audio.preload = 'auto';

  function sortTracks(){
    if(!tracks.length) return;
    if(shuffle){
      for(let i=tracks.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [tracks[i],tracks[j]]=[tracks[j],tracks[i]]; }
    } else {
      const coll = new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
      tracks.sort((a,b)=>{
        if(sortMode==='name') return coll.compare(a.rel, b.rel);
        if(sortMode==='date') return a.time - b.time;
        return b.time - a.time;
      });
    }
  }

  function startTrack(i){
    if(!tracks.length) return;
    tIdx = ((i % tracks.length) + tracks.length) % tracks.length;
    const t = tracks[tIdx];
    const old = trackUrl;
    trackUrl = URL.createObjectURL(t.file);
    audio.src = trackUrl;
    audio.muted = muted; audio.volume = volume;
    if(old) setTimeout(()=>URL.revokeObjectURL(old), 1000);
    $('track').textContent = '♪ ' + t.name + '（' + (tIdx+1) + '/' + tracks.length + '）';
    if(playing) audio.play().then(() => { failRun = 0; }).catch(armAudioTap);
  }
  // 音つきの自動再生を拒まれたら、最初の操作で鳴らす
  function armAudioTap(){
    toast('クリックすると音が鳴ります', 4000);
    const on = () => {
      audio.play().catch(()=>{});
      removeEventListener('mousedown', on, true); removeEventListener('keydown', on, true);
      removeEventListener('touchstart', on, true);
    };
    addEventListener('mousedown', on, true);
    addEventListener('keydown', on, true);
    addEventListener('touchstart', on, true);
  }
  audio.addEventListener('ended', () => {
    if(!asmr) return;
    failRun = 0;
    startTrack(tIdx + 1);   // 最後まで来たら最初に戻る
    next();                 // 音の切れ目で絵も変える
  });
  audio.addEventListener('error', () => {
    if(!asmr || !tracks.length) return;
    toast(tracks[tIdx].name + ' は再生できませんでした', 3000);
    if(++failRun >= tracks.length){ setAsmr(false); toast('再生できる音声がありませんでした', 4000); return; }
    startTrack(tIdx + 1);
  });

  function setAsmr(on){
    if(on && !tracks.length){ toast('このフォルダに音声ファイルがありません', 3000); return; }
    asmr = on;
    $('bAsmr').classList.toggle('act', on);
    $('track').hidden = !on;
    failRun = 0;
    if(on) startTrack(tIdx);
    else { audio.pause(); $('vtime').textContent = ''; }
    S.save();
    show(pos, true);        // 動画の扱い（消音・繰り返し）が変わるので作り直す
  }

  /* ---------- ホイールで拡大 ---------- */
  const MAXZ = 8;

  // カーソルの位置にいちばん近い枠の中身を返す。
  // 当たり判定（elementFromPoint）だと、重なっている前のスライドの層に取られて
  // 1枚おきに効かなくなるので、座標で選ぶ。余白（黒帯）の上で回しても効く。
  function under(x){
    if(!curPack) return null;
    let best = null, bd = Infinity;
    for(const slot of curPack.children){
      const r = slot.getBoundingClientRect();
      if(!r.width) continue;
      const d = x < r.left ? r.left - x : (x > r.right ? x - r.right : 0);
      if(d < bd){ bd = d; best = slot; }
    }
    return best ? best.querySelector('img,video') : null;
  }
  function zstate(el){
    if(!el.__z || !el.__z.w){          // まだ読み込めていないうちは測り直す
      const r = el.getBoundingClientRect();
      if(!r.width || !r.height) return null;
      // 箱いっぱいに映っているとは限らない（object-fit で内側に収まっている）ので、
      // 実際に映っている大きさを出しておく。動かせる範囲はこちらで決める。
      const nw = el.naturalWidth || el.videoWidth || 0, nh = el.naturalHeight || el.videoHeight || 0;
      const ma = (nw && nh) ? nw / nh : r.width / r.height;
      const cover = document.body.classList.contains('cover');
      const cw = cover ? Math.max(r.width, r.height * ma) : Math.min(r.width, r.height * ma);
      el.__z = {s:1, tx:0, ty:0, w:r.width, h:r.height, cw, ch: cw / ma,
                cx:r.left + r.width/2, cy:r.top + r.height/2};
    }
    return el.__z;
  }
  function draw(el){
    const z = el.__z;
    const mx = Math.max(0, (z.s * z.cw - z.w) / 2);   // 映像の外側が見えない範囲まで
    const my = Math.max(0, (z.s * z.ch - z.h) / 2);
    z.tx = Math.max(-mx, Math.min(mx, z.tx));
    z.ty = Math.max(-my, Math.min(my, z.ty));
    el.style.transform = z.s > 1 ? 'translate(' + z.tx + 'px,' + z.ty + 'px) scale(' + z.s + ')' : '';
  }
  // 拡大している間は自動送りを止める（見ている最中に流れていかないように）
  function setZoomed(v){
    if(zoomed === v) return;
    zoomed = v;
    document.body.classList.toggle('zoom', v);
    if(v){ clearTimeout(timer); timer = null; prog.style.width = '0%'; }
    else restart();
  }
  function resetZoom(){
    if(curPack) curPack.querySelectorAll('img,video').forEach(el => {
      el.style.transform = '';
      delete el.__z;                  // 表示の仕方や窓の大きさが変わっていたら測り直す
    });
    setZoomed(false);
  }

  stage.addEventListener('wheel', e => {
    const el = under(e.clientX);
    if(!el) return;
    e.preventDefault();
    const z = zstate(el);
    if(!z) return;
    const s2 = Math.max(1, Math.min(MAXZ, z.s * Math.exp(-e.deltaY * 0.0018)));
    const k = s2 / z.s;
    // カーソルの下の点が動かないように寄せる
    z.tx = e.clientX - z.cx - k * (e.clientX - z.cx - z.tx);
    z.ty = e.clientY - z.cy - k * (e.clientY - z.cy - z.ty);
    z.s = s2;
    if(s2 === 1){ z.tx = 0; z.ty = 0; }
    draw(el);
    setZoomed(s2 > 1);
    toast('拡大 ' + Math.round(s2 * 100) + '%', 900);
  }, {passive:false});

  stage.addEventListener('mousedown', e => {
    const el = under(e.clientX);
    if(!el || !el.__z || el.__z.s <= 1) return;
    pan = {el, x:e.clientX, y:e.clientY, moved:0};
    e.preventDefault();
  });
  addEventListener('mousemove', e => {
    if(!pan) return;
    const z = pan.el.__z;
    z.tx += e.clientX - pan.x; z.ty += e.clientY - pan.y;
    pan.moved += Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y);
    pan.x = e.clientX; pan.y = e.clientY;
    draw(pan.el);
  });
  addEventListener('mouseup', () => {
    if(pan && pan.moved > 4) skipClick = true;   // 動かしただけのときは一時停止させない
    pan = null;
  });
  stage.addEventListener('dblclick', resetZoom);

  /* ---------- 表示 ---------- */
  function makeEl(it, url, onEnd, onFail){
    let el;
    if(it.video){
      el = document.createElement('video');
      el.src = url; el.playsInline = true;
      // ASMRモードでは動画を消音＋繰り返しにして、音声の邪魔をしない絵として使う
      el.muted = asmr ? true : (muted || needTap);
      el.loop = asmr;
      el.volume = volume;
      el.onended = asmr ? null : onEnd;
      // 再生できない形式のときは、黙って飛ばさずに理由を出す
      el.onerror = () => {
        toast(it.name + ' は再生できませんでした（このブラウザが対応していない形式です）', 3200);
        setTimeout(onFail, 2600);
      };
      if(playing) el.play().catch(() => {   // 音つき自動再生を拒まれた
        armTap(); el.muted = true;
        el.play().catch(() => { toast(it.name + ' を再生できませんでした', 3000); setTimeout(onFail, 2600); });
      });
    } else {
      el = document.createElement('img');
      el.src = url; el.alt = it.name; el.decoding = 'async';
      el.onerror = onFail;
    }
    return el;
  }

  async function show(i, instant){
    if(!order.length) return;
    const my = ++token;
    let p = ((i % order.length) + order.length) % order.length;

    // 並べるかどうかの判断に、この前後の縦横比が要る
    if(pair){
      const probes = [];
      for(let k = Math.max(0, p - MAX_COLS); k < Math.min(order.length, p + MAX_COLS); k++)
        probes.push(measure(items[order[k]]));
      await Promise.race([Promise.all(probes), new Promise(r=>setTimeout(r, 600))]);
      if(my !== token) return;
    }

    const g = groupAt(p);
    const was = pos;
    pos = g[0]; span = g.length;
    if(was !== pos) seen++;

    const back = layers[1-front];
    back.innerHTML = '';
    // 前に映していた動画は、まだ画面から消えていなくても音を止める。
    // 放っておくと次の動画と重なって鳴る（レイヤは2枚を交互に使うので、
    // 上の innerHTML='' で消えるのは2つ前のぶん）。
    stage.querySelectorAll('video').forEach(v => { v.pause(); v.muted = true; });
    const packEl = document.createElement('div');
    packEl.className = 'pack ' + (g.length > 1 ? 'multi' : 'solo');
    curPack = packEl;
    zoomed = false; document.body.classList.remove('zoom');   // 送ったら等倍に戻る
    const urls = [];
    const advance = () => { if(playing && token === my) next(); };
    // 開けなかったものは、進んでいた向きに飛ばす（戻っている最中に前へ弾かれないように）
    const skip = () => { if(playing && token === my) (dir < 0 ? prev() : next()); };

    for(const k of g){
      const it = items[order[k]];
      const url = URL.createObjectURL(it.file);
      urls.push(url);
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.appendChild(makeEl(it, url, advance, skip));
      packEl.appendChild(slot);
    }
    back.appendChild(packEl);

    if(instant) back.style.transition = 'none';
    requestAnimationFrame(()=>{
      layers[front].classList.remove('on');
      back.classList.add('on');
      if(instant) requestAnimationFrame(()=>back.style.transition='');
      front = 1-front;
      const old = curUrls; curUrls = urls;
      if(old.length) setTimeout(()=>old.forEach(u=>URL.revokeObjectURL(u)), 600);
      setTimeout(() => {                      // 消え終わってから古いほうを片付ける
        if(token !== my) return;              // その間に次へ送られていたら触らない
        for(const L of layers) if(L !== packEl.parentNode) L.innerHTML = '';
      }, 700);
    });

    const names = g.map(k => items[order[k]].name);
    $('fname').textContent = names.join(' ／ ');
    $('fdir').textContent = items[order[g[0]]].dir ? '— ' + items[order[g[0]]].dir : '';
    $('count').textContent = (g.length > 1 ? (pos+1) + '–' + (pos+g.length) : (pos+1)) + ' / ' + order.length;
    $('colsLabel').textContent = g.length;

    // 次の組を先読み
    const nx = items[order[(pos + span) % order.length]];
    if(nx && !nx.video){
      const u = URL.createObjectURL(nx.file);
      const im = new Image(); im.src = u;
      im.onload = im.onerror = () => setTimeout(()=>URL.revokeObjectURL(u), 30000);
    }
    pump();
    restart();
  }

  const next = () => { dir =  1; show(pos + span); };
  const prev = () => { dir = -1; show(pos - 1); };

  /* ---------- タイマー ---------- */
  function restart(){
    clearTimeout(timer);
    const solo = !asmr && span === 1 && items[order[pos]] && items[order[pos]].video;
    if(playing && !solo){
      tStart = performance.now();
      timer = setTimeout(next, interval);
    } else {
      timer = null; prog.style.width = '0%';
    }
  }
  const mmss = t => Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0');
  (function tick(){
    const v = !asmr && curPack && curPack.querySelector('video');
    if(asmr){                                  // 絵は秒数で送るので、帯はそのまま。音の残りを出す
      $('vtime').textContent = (tracks.length && audio.duration)
        ? '♪ 残り ' + mmss(Math.max(0, audio.duration - audio.currentTime)) : '';
      if(playing && timer)
        prog.style.width = (Math.min(1,(performance.now()-tStart)/interval)*100).toFixed(2) + '%';
    } else if(v && v.duration){                // 動画は再生位置をそのまま進捗にする
      prog.style.width = (v.currentTime / v.duration * 100).toFixed(2) + '%';
      $('vtime').textContent = '残り ' + mmss(Math.max(0, v.duration - v.currentTime));
    } else {
      if($('vtime').textContent) $('vtime').textContent = '';
      if(playing && timer)
        prog.style.width = (Math.min(1,(performance.now()-tStart)/interval)*100).toFixed(2) + '%';
    }
    requestAnimationFrame(tick);
  })();

  function setPlaying(v){
    playing = v;
    $('bPlay').innerHTML = v
      ? '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
    if(curPack) curPack.querySelectorAll('video').forEach(vid => v ? vid.play().catch(()=>{}) : vid.pause());
    if(asmr && tracks.length){ v ? audio.play().catch(()=>{}) : audio.pause(); }
    if(v) restart(); else { clearTimeout(timer); timer = null; }
  }

  /* ---------- UI ---------- */
  $('bPick').onclick = async () => {
    err.textContent = '';
    if(window.showDirectoryPicker){
      try{
        const dir = await window.showDirectoryPicker();
        busy.classList.add('on');
        const out=[]; await fromHandle(dir, dir.name + '/', out);
        busy.classList.remove('on');
        return load(out);
      }catch(e){
        if(e && e.name === 'AbortError') return;
        // 非対応・file:// などは input にフォールバック
      }
    }
    input.click();
  };
  $('bOpen').onclick = () => { setPlaying(false); renderLog(); picker.classList.remove('hidden'); };

  $('bCsv').onclick = () => {
    const q = v => '"' + String(v).replace(/"/g,'""') + '"';
    const csv = '\ufeff' + ['日時','フォルダ','ファイル名','音声','位置','総数','見た枚数','視聴秒数','状態','きっかけ'].join(',')
      + '\n' + logAll().map(r => [stamp(r.t), r.folder, r.name, r.track || '', r.idx, r.total, r.seen,
          Math.round(r.ms/1000), r.playing ? '再生中' : '停止中', r.why].map(q).join(',')).join('\n');
    const u = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = u; a.download = 'slideshow-log.csv'; a.click();
    setTimeout(()=>URL.revokeObjectURL(u), 5000);
  };
  $('bClear').onclick = () => {
    if(confirm('中断の記録を全部消しますか？')){ localStorage.removeItem(LOG_KEY); renderLog(); }
  };
  input.onchange = () => { if(input.files.length) load([...input.files]); input.value=''; };

  $('bNext').onclick = next;
  $('bPrev').onclick = prev;
  $('bPlay').onclick = () => setPlaying(!playing);
  $('bPair').onclick = () => {
    pair = !pair;
    $('bPair').classList.toggle('act', pair);
    S.save(); pump(); show(pos, true);
  };
  $('bSound').onclick = () => {
    if(needTap){ needTap = false; applySound(); return; }
    muted = !muted;
    if(!muted && volume === 0) volume = 1;
    applySound(); S.save();
    toast(muted ? '消音' : '音量 ' + Math.round(volume*100) + '%');
  };
  $('bAsmr').onclick = () => setAsmr(!asmr);
  $('bShuffle').onclick = () => {
    shuffle = !shuffle;
    $('bShuffle').classList.toggle('act', shuffle);
    buildOrder(shuffle); S.save();
    show(shuffle ? 0 : pos, true);
  };
  $('sort').onchange = e => { sortMode = e.target.value; if(!shuffle){ buildOrder(false); show(pos, true); } S.save(); };
  $('ival').oninput = e => {
    interval = +e.target.value * 1000;
    $('ivalLabel').textContent = e.target.value + 's';
    S.save(); restart();
  };
  $('bFit').onclick = () => {
    document.body.classList.toggle('cover');
    $('bFit').classList.toggle('act', document.body.classList.contains('cover'));
    resetZoom(); S.save();
  };
  $('bFull').onclick = () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  };
  stage.onclick = () => {
    if(skipClick){ skipClick = false; return; }
    if(picker.classList.contains('hidden')) setPlaying(!playing);
  };

  document.addEventListener('keydown', e => {
    if(!picker.classList.contains('hidden')) return;
    const k = e.key.toLowerCase();
    if(k === ' '){ e.preventDefault(); setPlaying(!playing); }
    else if(e.key === 'ArrowRight' || k === 'j'){ next(); }
    else if(e.key === 'ArrowLeft' || k === 'k'){ prev(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); setVolume(volume + 0.1); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); setVolume(volume - 0.1); }
    else if(k === 'm'){ $('bSound').click(); }
    else if(k === '0'){ resetZoom(); }
    else if(k === 'a'){ setAsmr(!asmr); }
    else if(k === 'f'){ $('bFull').click(); }
    else if(k === 'p'){ $('bPair').click(); }
    else if(k === 's'){ $('bShuffle').click(); }
    else if(k === 'c'){ $('bFit').click(); }
    else if(k === 'h'){ document.body.classList.toggle('hideui'); }
    else if(k === 'home'){ show(0); }
  });

  // 画面の縦横比が変わったら、並べる枚数を計算し直す
  let rz;
  addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      resetZoom();
      if(!order.length || !pair) return;
      if(groupAt(pos).length !== span) show(pos, true);
    }, 200);
  });

  /* ---------- ドラッグ&ドロップ ---------- */
  ['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
    e.preventDefault(); card.classList.add('drag');
  }));
  ['dragleave','dragend'].forEach(ev => document.addEventListener(ev, e => {
    if(e.relatedTarget) return; card.classList.remove('drag');
  }));
  document.addEventListener('drop', async e => {
    e.preventDefault(); card.classList.remove('drag');
    busy.classList.add('on');
    const files = await fromDrop(e.dataTransfer);
    busy.classList.remove('on');
    if(files.length) load(files); else err.textContent = 'フォルダを読み込めませんでした';
  });

  /* ---------- 操作がないときはUIを隠す ---------- */
  let idleT;
  function wake(){
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(()=>document.body.classList.add('idle'), 2500);
  }
  ['mousemove','mousedown','keydown','wheel','touchstart'].forEach(ev =>
    document.addEventListener(ev, wake, {passive:true}));

  /* ---------- 起動時に設定を復元 ---------- */
  const s = S.load();
  if(s.interval){ interval = s.interval; $('ival').value = interval/1000; $('ivalLabel').textContent = interval/1000 + 's'; }
  if(s.sortMode){ sortMode = s.sortMode; $('sort').value = sortMode; }
  if(s.shuffle){ shuffle = true; $('bShuffle').classList.add('act'); }
  if(s.pair){ pair = true; $('bPair').classList.add('act'); }
  if(s.asmr){ asmr = true; $('bAsmr').classList.add('act'); }
  if(s.cover){ document.body.classList.add('cover'); $('bFit').classList.add('act'); }
  if(s.muted) muted = true;
  if(typeof s.volume === 'number') volume = s.volume;
  applySound();
  setPlaying(true);
  renderLog();
})();
</script>
</body>
</html>
